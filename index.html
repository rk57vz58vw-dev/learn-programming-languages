<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغامرة البرمجة</title>

  <style>
    :root {
      --bg: #101827;
      --panel: #1b2638;
      --panel-light: #243249;
      --text: #f4f7fb;
      --muted: #b5c0d0;
      --accent: #70e1b2;
      --border: #344258;
      --danger: #ff8e8e;
      --success: #8ef0b0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 28px 16px;
      text-align: center;
      background: linear-gradient(120deg, #182943, #174d4b);
    }

    header h1 { margin: 0 0 5px; }
    header p { margin: 0; color: var(--muted); }

    main {
      width: min(1000px, 94%);
      margin: 22px auto 50px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .topbar, .stats, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .topbar { justify-content: space-between; }

    select, button {
      font: inherit;
      border-radius: 10px;
      padding: 10px 14px;
    }

    select {
      color: var(--text);
      background: #111a29;
      border: 1px solid var(--border);
    }

    button {
      border: 0;
      background: var(--accent);
      color: #10231d;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(1.08); }

    button:disabled {
      background: #536174;
      color: #d0d7df;
      cursor: not-allowed;
    }

    .secondary {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .stats { margin-top: 14px; color: var(--muted); }

    .badge {
      display: inline-block;
      background: #26364c;
      border-radius: 999px;
      padding: 5px 12px;
    }

    .progress-track {
      height: 12px;
      background: #111a29;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .25s ease;
    }

    .stage-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .stage-card {
      min-height: 92px;
      text-align: right;
      background: #131e2e;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
    }

    .stage-card.active { outline: 2px solid var(--accent); }
    .stage-card.done { border-color: var(--success); }
    .stage-card.locked { opacity: .55; }

    .stage-card small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
    }

    pre {
      direction: ltr;
      text-align: left;
      overflow-x: auto;
      white-space: pre-wrap;
      padding: 15px;
      background: #0c1320;
      border: 1px solid #26364c;
      border-radius: 10px;
      color: #b9f6d5;
    }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: right;
      margin: 8px 0;
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .quiz-option.selected { outline: 2px solid var(--accent); }

    #feedback {
      min-height: 1.7em;
      font-weight: 700;
    }

    .muted { color: var(--muted); }

    @media (max-width: 600px) {
      .panel { padding: 15px; }
      .topbar { align-items: stretch; }
    }
  </style>
</head>

<body>
  <header>
    <h1>🧭 مغامرة البرمجة</h1>
    <p>تعلّم البرمجة مرحلةً مرحلة، واجتز الاختبارات لفتح المستوى التالي!</p>
  </header>

  <main>
    <section class="panel">
      <div class="topbar">
        <div>
          <label for="language"><strong>لغة البرمجة:</strong></label>
          <select id="language">
            <option value="python">🐍 بايثون</option>
            <option value="javascript">🌐 جافاسكريبت</option>
            <option value="cpp">⚙️ سي بلس بلس (C++)</option>
          </select>
        </div>

        <button id="resetButton" class="secondary" type="button">
          إعادة تقدم هذه اللغة
        </button>
      </div>

      <div class="stats">
        <span class="badge">⭐ النقاط: <b id="points">0</b></span>
        <span class="badge">🏅 المراحل المكتملة: <b id="completed">0</b></span>
        <span class="badge">🗺️ المرحلة المفتوحة: <b id="unlocked">1</b></span>
      </div>

      <div class="progress-track" aria-label="التقدم في اللغة">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <section class="panel">
      <h2>خريطة المراحل</h2>
      <p class="muted">أجب إجابة صحيحة لفتح المرحلة التالية.</p>
      <div id="stageList" class="stage-list"></div>
    </section>

    <section class="panel">
      <h2 id="lessonTitle"></h2>
      <p id="lessonText"></p>
      <pre><code id="lessonCode"></code></pre>

      <h3>🎯 اختبار المرحلة</h3>
      <p id="question"></p>
      <div id="options"></div>
      <p id="feedback" aria-live="polite"></p>

      <div class="actions">
        <button id="nextButton" type="button" disabled>المرحلة التالية ←</button>
      </div>
    </section>

    <p class="muted">
      ملاحظة: التقدم محفوظ في هذا المتصفح على هذا الجهاز.
    </p>
  </main>

  <script>
    const courses = {
      python: {
        stages: [
          {
            title: "1. البداية والطباعة",
            text: "الدالة print تعرض النصوص والقيم. النص يوضع عادةً بين علامتي اقتباس.",
            code: 'print("مرحبًا بالعالم!")',
            question: "أي أمر يطبع رسالة في بايثون؟",
            options: ['print("مرحبا")', 'console.log("مرحبا")', 'echo("مرحبا")'],
            answer: 0
          },
          {
            title: "2. المتغيرات",
            text: "المتغير اسم نستخدمه لتخزين قيمة، مثل اسم أو رقم.",
            code: 'name = "ليلى"\\nage = 12\\nprint(name, age)',
            question: "كيف نخزن الرقم 5 في متغير اسمه score؟",
            options: ["5 = score", "score == 5", "score = 5"],
            answer: 2
          },
          {
            title: "3. أنواع البيانات",
            text: "من الأنواع الشائعة: الأعداد الصحيحة، الأعداد العشرية، النصوص، والقيم المنطقية.",
            code: 'age = 15          # عدد صحيح\\nprice = 2.5       # عدد عشري\\nname = "علي"     # نص\\nis_ready = True  # قيمة منطقية',
            question: "أي قيمة تمثل نصًا؟",
            options: ["42", '"مرحبا"', "True"],
            answer: 1
          },
          {
            title: "4. الشروط",
            text: "تسمح if بتنفيذ أوامر عندما يتحقق شرط. انتبه للمسافات البادئة في بايثون.",
            code: 'age = 18\\nif age >= 18:\\n    print("بالغ")\\nelse:\\n    print("أصغر من 18")',
            question: "ما الكلمة التي تبدأ الجملة الشرطية؟",
            options: ["for", "if", "def"],
            answer: 1
          },
          {
            title: "5. الحلقات",
            text: "الحلقة تكرر الأوامر. range(3) تنتج الأرقام 0 و1 و2.",
            code: "for i in range(3):\\n    print(i)",
            question: "كم مرة تنفذ الحلقة في المثال؟",
            options: ["مرتين", "3 مرات", "4 مرات"],
            answer: 1
          },
          {
            title: "6. القوائم",
            text: "القائمة تخزن عدة قيم بترتيب. يبدأ ترقيم العناصر من الصفر.",
            code: 'fruits = ["تفاح", "موز", "عنب"]\\nprint(fruits[0])',
            question: "أي عنصر تطبعه fruits[0]؟",
            options: ["تفاح", "موز", "عنب"],
            answer: 0
          },
          {
            title: "7. الدوال",
            text: "الدالة تجمع أوامر تحت اسم، ويمكن استدعاؤها عند الحاجة.",
            code: 'def greet(name):\\n    print("أهلًا", name)\\n\\ngreet("سارة")',
            question: "ما الكلمة المستخدمة لتعريف دالة في بايثون؟",
            options: ["function", "def", "make"],
            answer: 1
          },
          {
            title: "8. القواميس",
            text: "القاموس يخزن البيانات على شكل مفتاح وقيمة.",
            code: 'person = {"name": "عمر", "age": 20}\\nprint(person["name"])',
            question: "كيف نصل إلى قيمة المفتاح name؟",
            options: ['person["name"]', "person.name()", "person(name)"],
            answer: 0
          }
        ]
      },

      javascript: {
        stages: [
          {
            title: "1. البداية والطباعة",
            text: "تستخدم console.log لعرض قيمة في وحدة تحكم المتصفح.",
            code: 'console.log("مرحبًا بالعالم!");',
            question: "أي أمر يطبع رسالة في وحدة التحكم؟",
            options: ["print()", "console.log()", "echo()"],
            answer: 1
          },
          {
            title: "2. المتغيرات",
            text: "استخدم let لمتغير يمكن تغيير قيمته، وconst لقيمة لا يعاد إسنادها.",
            code: 'let score = 10;\\nscore = 15;\\nconst country = "العراق";',
            question: "أي كلمة مناسبة لمتغير يمكن تغيير قيمته؟",
            options: ["let", "def", "echo"],
            answer: 0
          },
          {
            title: "3. أنواع البيانات",
            text: "تتعامل جافاسكريبت مع أرقام ونصوص وقيم منطقية وغيرها.",
            code: 'let age = 15;\\nlet name = "نور";\\nlet isReady = true;',
            question: "أي قيمة تمثل نصًا؟",
            options: ["15", '"نور"', "true"],
            answer: 1
          },
          {
            title: "4. الشروط",
            text: "تستخدم if لفحص شرط. توضع الأوامر داخل الأقواس المعقوفة.",
            code: 'let age = 18;\\nif (age >= 18) {\\n  console.log("بالغ");\\n} else {\\n  console.log("أصغر من 18");\\n}',
            question: "ما الكلمة التي تبدأ الشرط؟",
            options: ["when", "if", "repeat"],
            answer: 1
          },
          {
            title: "5. الحلقات",
            text: "تكرر for الأوامر حسب الشرط المكتوب فيها.",
            code: 'for (let i = 0; i < 3; i++) {\\n  console.log(i);\\n}',
            question: "كم مرة تعمل الحلقة؟",
            options: ["مرتين", "3 مرات", "4 مرات"],
            answer: 1
          },
          {
            title: "6. المصفوفات",
            text: "المصفوفة تخزن عدة قيم، ويبدأ فهرس أول عنصر من الصفر.",
            code: 'const colors = ["أحمر", "أزرق", "أخضر"];\\nconsole.log(colors[0]);',
            question: "ماذا تعرض colors[0]؟",
            options: ["أحمر", "أزرق", "أخضر"],
            answer: 0
          },
          {
            title: "7. الدوال",
            text: "الدالة تنظم الأوامر وتتيح إعادة استخدامها.",
            code: 'function greet(name) {\\n  console.log("أهلًا " + name);\\n}\\n\\ngreet("سارة");',
            question: "أي كلمة تظهر لتعريف الدالة في المثال؟",
            options: ["function", "def", "method"],
            answer: 0
          },
          {
            title: "8. الكائنات",
            text: "الكائن يجمع بيانات مرتبطة باستخدام أسماء خصائص وقيم.",
            code: 'const person = { name: "عمر", age: 20 };\\nconsole.log(person.name);',
            question: "كيف نصل إلى خاصية name؟",
            options: ["person->name", "person.name", "person(name)"],
            answer: 1
          }
        ]
      },

      cpp: {
        stages: [
          {
            title: "1. البداية والطباعة",
            text: "تستخدم cout للطباعة، وتحتاج إلى تضمين مكتبة iostream.",
            code: '#include <iostream>\\nusing namespace std;\\n\\nint main() {\\n  cout << "مرحبًا بالعالم!";\\n  return 0;\\n}',
            question: "أي أداة تطبع النص في المثال؟",
            options: ["cout", "print", "console.log"],
            answer: 0
          },
          {
            title: "2. المتغيرات",
            text: "في C++ نكتب نوع البيانات قبل اسم المتغير.",
            code: 'int age = 15;\\ndouble price = 2.5;\\nstring name = "نور";',
            question: "أي نوع مناسب لعدد صحيح؟",
            options: ["int", "string", "cout"],
            answer: 0
          },
          {
            title: "3. أنواع البيانات",
            text: "int للأعداد الصحيحة، وdouble للأعداد العشرية، وstring للنصوص.",
            code: '#include <string>\\nusing namespace std;\\n\\nint count = 4;\\ndouble price = 3.5;\\nstring city = "بغداد";',
            question: "أي نوع مناسب لتخزين نص؟",
            options: ["int", "string", "double"],
            answer: 1
          },
          {
            title: "4. الشروط",
            text: "تستخدم if لفحص شرط، وتوضع الأوامر داخل أقواس معقوفة.",
            code: 'if (age >= 18) {\\n  cout << "بالغ";\\n} else {\\n  cout << "أصغر من 18";\\n}',
            question: "ما الكلمة التي تبدأ الشرط؟",
            options: ["when", "if", "loop"],
            answer: 1
          },
          {
            title: "5. الحلقات",
            text: "تكرر for الأوامر. في المثال تطبع الحلقة 0 و1 و2.",
            code: 'for (int i = 0; i < 3; i++) {\\n  cout << i << endl;\\n}',
            question: "كم مرة تتكرر الحلقة؟",
            options: ["مرتين", "3 مرات", "4 مرات"],
            answer: 1
          },
          {
            title: "6. المصفوفات",
            text: "المصفوفة تخزن مجموعة عناصر من النوع نفسه، ويبدأ الفهرس من الصفر.",
            code: 'int numbers[3] = {10, 20, 30};\\ncout << numbers[0];',
            question: "ما قيمة numbers[0]؟",
            options: ["10", "20", "30"],
            answer: 0
          },
          {
            title: "7. الدوال",
            text: "الدالة تنظم الأوامر. تستخدم void عندما لا تعيد قيمة.",
            code: 'void greet() {\\n  cout << "أهلًا";\\n}\\n\\nint main() {\\n  greet();\\n  return 0;\\n}',
            question: "ماذا تعني void في تعريف الدالة؟",
            options: ["تعيد نصًا", "لا تعيد قيمة", "تعرف مصفوفة"],
            answer: 1
          },
          {
            title: "8. الدوال مع مدخلات",
            text: "يمكن تمرير قيمة إلى الدالة عبر معامل، مثل name في المثال.",
            code: '#include <iostream>\\n#include <string>\\nusing namespace std;\\n\\nvoid greet(string name) {\\n  cout << "أهلًا " << name;\\n}',
            question: "ما نوع المعامل name في المثال؟",
            options: ["int", "string", "double"],
            answer: 1
          }
        ]
      }
    };

    const languageSelect = document.getElementById("language");
    const stageList = document.getElementById("stageList");
    const nextButton = document.getElementById("nextButton");
    const feedback = document.getElementById("feedback");
    const resetButton = document.getElementById("resetButton");

    let currentStage = 0;
    let answeredCorrectly = false;

    function storageKey() {
      return "codeAdventure:" + languageSelect.value;
    }

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem(storageKey())) || {
          points: 0,
          unlocked: 1
        };
      } catch {
        return { points: 0, unlocked: 1 };
      }
    }

    function saveProgress(progress) {
      localStorage.setItem(storageKey(), JSON.stringify(progress));
    }

    function render() {
      const course = courses[languageSelect.value];
      const progress = getProgress();

      currentStage = Math.min(
        Math.max(0, progress.unlocked - 1),
        course.stages.length - 1
      );

      document.getElementById("points").textContent = progress.points;
      document.getElementById("unlocked").textContent = progress.unlocked;
      document.getElementById("completed").textContent =
        Math.min(progress.unlocked - 1, course.stages.length);

      const percent = ((progress.unlocked - 1) / course.stages.length) * 100;
      document.getElementById("progressFill").style.width = percent + "%";

      renderMap();
      showStage();
    }

    function renderMap() {
      const course = courses[languageSelect.value];
      const progress = getProgress();
      stageList.innerHTML = "";

      course.stages.forEach((stage, index) => {
        const isUnlocked = index < progress.unlocked;
        const card = document.createElement("button");

        card.type = "button";
        card.className = "stage-card";
        if (index === currentStage) card.classList.add("active");
        if (index + 1 < progress.unlocked) card.classList.add("done");
        if (!isUnlocked) card.classList.add("locked");

        card.innerHTML =
          `<strong>${stage.title}</strong>` +
          `<small>${isUnlocked ? "مفتوحة — اضغط للدخول" : "🔒 مقفلة"}</small>`;

        card.disabled = !isUnlocked;
        card.addEventListener("click", () => {
          currentStage = index;
          showStage();
          renderMap();
        });

        stageList.appendChild(card);
      });
    }

    function showStage() {
      const course = courses[languageSelect.value];
      const stage = course.stages[currentStage];

      answeredCorrectly = false;
      nextButton.disabled = true;
      nextButton.textContent =
        currentStage === course.stages.length - 1
          ? "إنهاء الدورة 🎉"
          : "المرحلة التالية ←";

      document.getElementById("lessonTitle").textContent = stage.title;
      document.getElementById("lessonText").textContent = stage.text;
      document.getElementById("lessonCode").textContent = stage.code;
      document.getElementById("question").textContent = stage.question;
      feedback.textContent = "";

      const optionsBox = document.getElementById("options");
      optionsBox.innerHTML = "";

      stage.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quiz-option";
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(index, button));
        optionsBox.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answeredCorrectly) return;

      const course = courses[languageSelect.value];
      const stage = course.stages[currentStage];

      if (selectedIndex !== stage.answer) {
        feedback.textContent = "❌ إجابة غير صحيحة، حاول مرة أخرى.";
        feedback.style.color = "var(--danger)";
        selectedButton.classList.add("selected");
        return;
      }

      answeredCorrectly = true;
      feedback.textContent = "✅ إجابة صحيحة! حصلت على 10 نقاط.";
      feedback.style.color = "var(--success)";

      const progress = getProgress();
      progress.points += 10;
      progress.unlocked = Math.max(
        progress.unlocked,
        Math.min(currentStage + 2, course.stages.length)
      );
      saveProgress(progress);

      nextButton.disabled = false;
      renderMap();

      document.getElementById("points").textContent = progress.points;
      document.getElementById("unlocked").textContent = progress.unlocked;
      document.getElementById("completed").textContent =
        Math.min(progress.unlocked - 1, course.stages.length);

      const percent = ((progress.unlocked - 1) / course.stages.length) * 100;
      document.getElementById("progressFill").style.width = percent + "%";
    }

    nextButton.addEventListener("click", () => {
      if (!answeredCorrectly) return;

      const course = courses[languageSelect.value];

      if (currentStage < course.stages.length - 1) {
        currentStage++;
        renderMap();
        showStage();
      } else {
        feedback.textContent = "🏆 أحسنت! أكملت جميع مراحل هذه اللغة.";
        feedback.style.color = "var(--success)";
        nextButton.disabled = true;
      }
    });

    languageSelect.addEventListener("change", render);

    resetButton.addEventListener("click", () => {
      const confirmed = confirm(
        "هل تريد حذف النقاط والتقدم المحفوظ لهذه اللغة؟"
      );

      if (confirmed) {
        localStorage.removeItem(storageKey());
        render();
      }
    });

    render();
  </script>
</body>
</html>
